[project]
name = "bondspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lukasmki", email = "lukasarus@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ase>=3.28.0",
    "pyscf>=2.13.0",
    "pytblis>=0.0.14",
    "scipy>=1.17.1",
]

[project.scripts]
bondspace = "bondspace:main"

[project.optional-dependencies]
cuda12 = [
    "cutensor-cu12>=2.6.0",
    "gpu4pyscf-cuda12x>=1.7.1",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised from inside ase.atoms on every Atoms copy; not our code.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
